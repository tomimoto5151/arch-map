  /* ── canvas: 移動・拡大縮小できるキャンバス ── */
  const ZMIN = 0.3, ZMAX = 2;
  // 大きな図でも全体が 1 画面に収まるよう、いちばん小さい倍率は図の大きさに合わせて ZMIN より下げる
  const zMin = () => Math.max(0.02, Math.min(ZMIN, (els.stage.clientWidth - 16) / (els.canvas.offsetWidth || 1), (els.stage.clientHeight - 16) / (els.canvas.offsetHeight || 1)));
  const pan = { x: 0, y: 0, sl: 0, st: 0, dragged: false, suppress: false, space: false, over: false };
  // 図のまわりに表示枠の半分ずつ余白を取り、図が小さくても上下左右に動かせるようにする。
  // 枠の大きさが変わって余白が変わっても、見えている位置がずれないようスクロール量を補正する
  // 帯の見出しが画面の外へ出たら、スプレッドシートの列固定のように画面の端へ貼り付けて出す（文字の大きさは拡大率によらない）
  function updateLaneBar() {
    const frames = [...els.rows.querySelectorAll('.grp.lane')];
    const H = bandMode(), S = els.stage.getBoundingClientRect(), L = els.lanebar.getBoundingClientRect(), W = 152;
    // 左上の凡例とかぶらないよう、凡例の下から文字をはじめる（位置は貼り付ける層 L から測る）
    const hud = els.legend.parentElement.getBoundingClientRect(), below = Math.max(S.top, hud.bottom + 8) - L.top;
    els.lanebar.replaceChildren(...frames.flatMap((f) => {
      const r = f.getBoundingClientRect();
      const hidden = H ? r.left < S.left - 2 : r.top < S.top - 2;
      const a = H ? Math.max(r.top, S.top) : Math.max(r.left, S.left), b = H ? Math.min(r.bottom, S.bottom) : Math.min(r.right, S.right);
      if (!hidden || b - a < 16) return [];
      const head = f.querySelector('.grp-h');
      const el = document.createElement('div');
      el.className = 'lh';
      el.style.setProperty('--c', f.style.getPropertyValue('--c'));
      el.innerHTML = `<span class="idx">${esc(head.querySelector('.idx')?.textContent)}</span><b>${esc(head.querySelector('b')?.textContent)}</b>`;
      if (H) Object.assign(el.style, { left: `${S.left - L.left}px`, top: `${a - L.top}px`, width: `${W}px`, height: `${b - a}px`, paddingTop: `${Math.max(6, below - (a - L.top))}px` });
      else Object.assign(el.style, { top: `${below}px`, left: `${a - L.left}px`, width: `${b - a}px` });
      return [el];
    }));
  }
  let laneRaf = 0;
  els.stage.addEventListener('scroll', () => { cancelAnimationFrame(laneRaf); laneRaf = requestAnimationFrame(updateLaneBar); }, { passive: true });
  function applyZoom() {
    const padX = Math.round(els.stage.clientWidth / 2), padY = Math.round(els.stage.clientHeight / 2);
    const dx = padX - cam.padX, dy = padY - cam.padY;
    cam.padX = padX;
    cam.padY = padY;
    els.canvas.style.transform = `scale(${cam.z})`;
    els.canvas.style.left = `${padX}px`;
    els.canvas.style.top = `${padY}px`;
    els.sizer.style.width = `${els.canvas.offsetWidth * cam.z + padX * 2}px`;
    els.sizer.style.height = `${els.canvas.offsetHeight * cam.z + padY * 2}px`;
    if (dx) els.stage.scrollLeft += dx;
    if (dy) els.stage.scrollTop += dy;
    els.zoomV.textContent = `${Math.round(cam.z * 100)}%`;
    updateLaneBar();
  }
  // (cx, cy) は表示枠の中の点。その点の下にある図が動かないように拡大縮小する
  function zoomTo(z, cx = els.stage.clientWidth / 2, cy = els.stage.clientHeight / 2) {
    const z1 = cam.z, z2 = Math.max(zMin(), Math.min(ZMAX, z));
    const px = (els.stage.scrollLeft + cx - cam.padX) / z1;
    const py = (els.stage.scrollTop + cy - cam.padY) / z1;
    cam.z = z2;
    cam.touched = true;
    applyZoom();
    els.stage.scrollLeft = px * z2 + cam.padX - cx;
    els.stage.scrollTop = py * z2 + cam.padY - cy;
  }
  const zoomBy = (f) => zoomTo(cam.z * f);
  // all=false は初期表示（文字が読めるよう 60% より小さくしない。収まらなければ流れの始まり＝左上から見せる）、
  // all=true は縦横とも収めて真ん中に置く
  function fitView(all) {
    const w = els.canvas.offsetWidth, h = els.canvas.offsetHeight;
    const sw = els.stage.clientWidth, sh = els.stage.clientHeight;
    cam.z = Math.max(all ? zMin() : 0.6, Math.min(1, (sw - 16) / w, (sh - 16) / h));
    applyZoom();
    const off = (c, s) => (all ? (c - s) / 2 : Math.min(0, (c - s) / 2));
    els.stage.scrollLeft = cam.padX + off(w * cam.z, sw);
    els.stage.scrollTop = cam.padY + off(h * cam.z, sh);
  }
  function home() {
    cam.touched = false;
    fitView(false);
  }
  function paintDirButton() {
    const hint = horiz ? 'いまは横の流れ（左から右）。クリックで縦の流れに切り替え' : 'いまは縦の流れ（上から下）。クリックで横の流れに切り替え';
    els.dir.textContent = horiz ? '↔ 横' : '↕ 縦';
    els.dir.title = hint;
    els.dir.setAttribute('aria-label', hint);
  }
  function toggleDir() {
    if (els.dir.hidden) return;
    horiz = !horiz;
    try { localStorage.setItem('arch-map-dir', horiz ? 'h' : 'v'); } catch { /* 保存できなくても今回の表示は切り替わる */ }
    paintDirButton();
    renderAll();
    home();
  }
  paintDirButton();
  function reveal(id) {
    const el = els.rows.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
    if (!el) return;
    const s = els.stage.getBoundingClientRect(), r = el.getBoundingClientRect(), m = 24;
    const dx = r.left < s.left + m ? r.left - s.left - m : r.right > s.right - m ? r.right - s.right + m : 0;
    const dy = r.top < s.top + m ? r.top - s.top - m : r.bottom > s.bottom - m ? r.bottom - s.bottom + m : 0;
    if (dx || dy) els.stage.scrollBy({ left: dx, top: dy, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  // 移動: スペース＋ドラッグ（箱の上からでも可）・空いている所の左ドラッグ・中ボタンドラッグ。
  // 中ボタンは pointer 系イベントが届かないブラウザがあるため mouse 系で扱う。タッチは標準のスクロールに任せる
  els.stage.addEventListener('mouseenter', () => { pan.over = true; });
  els.stage.addEventListener('mouseleave', () => { pan.over = false; });
  els.stage.addEventListener('mousedown', (ev) => {
    const onNode = !!ev.target.closest('.node');
    if (!(ev.button === 1 || (ev.button === 0 && (pan.space || !onNode)))) return;
    ev.preventDefault();
    Object.assign(pan, { x: ev.clientX, y: ev.clientY, sl: els.stage.scrollLeft, st: els.stage.scrollTop, dragged: false });
    addEventListener('mousemove', movePan);
    addEventListener('mouseup', endPan);
  });
  function movePan(ev) {
    if (ev.buttons === 0) { endPan(); return; }
    const dx = ev.clientX - pan.x, dy = ev.clientY - pan.y;
    if (!pan.dragged && Math.hypot(dx, dy) < 4) return;
    if (!pan.dragged) { pan.dragged = true; els.stage.classList.add('panning'); }
    els.stage.scrollLeft = pan.sl - dx;
    els.stage.scrollTop = pan.st - dy;
  }
  // ドラッグを終えた直後のクリック 1 回だけを無視する（選択が切り替わらないように）
  function endPan() {
    removeEventListener('mousemove', movePan);
    removeEventListener('mouseup', endPan);
    els.stage.classList.remove('panning');
    if (!pan.dragged) return;
    pan.dragged = false;
    pan.suppress = true;
    setTimeout(() => { pan.suppress = false; });
  }
  els.stage.addEventListener('auxclick', (ev) => { if (ev.button === 1) ev.preventDefault(); });
  els.stage.addEventListener('wheel', (ev) => {
    if (!ev.ctrlKey && !ev.metaKey) return;
    ev.preventDefault();
    const r = els.stage.getBoundingClientRect();
    zoomTo(cam.z * Math.exp(-ev.deltaY * 0.002), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
  if (!document.fullscreenEnabled) els.fs.hidden = true;
  document.addEventListener('fullscreenchange', () => { els.fs.textContent = document.fullscreenElement ? '戻す' : '全画面'; });
  els.inspClose.addEventListener('click', () => setInsp(false));
  els.inspOpen.addEventListener('click', () => setInsp(true));
  els.zoom.addEventListener('click', (ev) => {
    const k = ev.target.closest('[data-zoom]')?.dataset.zoom;
    if (k === 'in') zoomBy(1.2);
    else if (k === 'out') zoomBy(1 / 1.2);
    else if (k === 'reset') zoomBy(1 / cam.z);
    else if (k === 'fit') fitView(true);
    else if (k === 'home') home();
    else if (k === 'dir') toggleDir();
    else if (k === 'png') exportPNG();
    else if (k === 'full') toggleFullscreen();
  });

  /* ── PNG 書き出し: 画面に描いている要素の位置と色を読み取り、canvas に描き直す（外部ライブラリなし・オフライン可） ── */
  const probe = document.createElement('canvas').getContext('2d');
  // canvas が解釈できない color(srgb …) 形式は rgba に直す
  function cc(str) {
    if (!str || str === 'none') return 'rgba(0,0,0,0)';
    probe.fillStyle = '#010203';
    probe.fillStyle = str;
    if (probe.fillStyle !== '#010203') return str;
    const m = str.match(/color\(srgb\s+([-\d.e]+)\s+([-\d.e]+)\s+([-\d.e]+)(?:\s*\/\s*([-\d.e]+%?))?\)/);
    if (!m) return 'rgba(0,0,0,0)';
    const a = m[4] == null ? 1 : m[4].endsWith('%') ? parseFloat(m[4]) / 100 : Number(m[4]);
    return `rgba(${Math.round(m[1] * 255)},${Math.round(m[2] * 255)},${Math.round(m[3] * 255)},${a})`;
  }
  // linear-gradient(角度?, 色 位置?, …) を読み取る（この図で使う上→下・左→右だけを扱う）
  function parseGradient(str) {
    const m = /linear-gradient\((.*)\)/.exec(str || '');
    if (!m) return null;
    const parts = [];
    let depth = 0, cur = '';
    for (const ch of m[1]) {
      if (ch === '(') depth += 1;
      if (ch === ')') depth -= 1;
      if (ch === ',' && depth === 0) { parts.push(cur.trim()); cur = ''; } else cur += ch;
    }
    parts.push(cur.trim());
    let horizontal = false;
    if (/deg$/.test(parts[0])) horizontal = parseFloat(parts.shift()) === 90;
    else if (/^to /.test(parts[0])) horizontal = parts.shift() === 'to right';
    const stops = parts.map((p) => { const mm = /^(.*?)(?:\s+(-?[\d.]+)%)?$/.exec(p); return { color: cc(mm[1].trim()), at: mm[2] == null ? null : Number(mm[2]) / 100 }; });
    stops.forEach((st, i) => { if (st.at == null) st.at = i === 0 ? 0 : i === stops.length - 1 ? 1 : (stops[i - 1].at + 1) / 2; });
    return { horizontal, stops };
  }
  function exportCanvas() {
    const z = cam.z, C = els.canvas.getBoundingClientRect();
    const loc = (r) => ({ x: (r.left - C.left) / z, y: (r.top - C.top) / z, w: r.width / z, h: r.height / z });
    const root = getComputedStyle(document.documentElement);
    const tok = (n) => root.getPropertyValue(n).trim();
    // 図の外接矩形（枠・線・表示中のラベル）+ 余白
    const boxes = [...els.rows.querySelectorAll('.grp, .tools')].map((el) => loc(el.getBoundingClientRect()));
    for (const g of els.wires.children) { const b = g.getBBox(); boxes.push({ x: b.x, y: b.y, w: b.width, h: b.height }); }
    for (const t of els.labels.querySelectorAll('.wl.on')) boxes.push(loc(t.getBoundingClientRect()));
    if (!boxes.length) return null;
    const M = 32, HEAD = 72;
    const x0 = Math.min(...boxes.map((b) => b.x)) - M, y0 = Math.min(...boxes.map((b) => b.y)) - M;
    const W = Math.max(...boxes.map((b) => b.x + b.w)) + M - x0, H = Math.max(...boxes.map((b) => b.y + b.h)) + M - y0 + HEAD;
    const scale = Math.min(2, 8192 / Math.max(W, H));
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(W * scale);
    cv.height = Math.ceil(H * scale);
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);

    // 背景: 地の色 + キャンバスの色 + ドット方眼
    ctx.fillStyle = cc(tok('--bg-0'));
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = cc(getComputedStyle(els.stage).backgroundColor);
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = cc(tok('--dot'));
    for (let y = HEAD + 8; y < H; y += 16) for (let x = 8; x < W; x += 16) ctx.fillRect(x, y, 1, 1);

    // 見出し帯: プロジェクト名・表示・凡例・更新日
    const font = getComputedStyle(document.body).fontFamily;
    const v = VIEWS.find((x) => x.id === state.view);
    ctx.textBaseline = 'middle';
    ctx.fillStyle = cc(tok('--text'));
    ctx.font = `700 15px ${font}`;
    ctx.fillText(`${project.name || 'アーキテクチャ図'}  ·  ${v.desc}`, M, 26);
    ctx.font = `400 12px ${font}`;
    let lx = M;
    for (const lg of els.legend.querySelectorAll('.lg')) {
      const bar = lg.querySelector('.bar');
      if (bar) { ctx.fillStyle = cc(getComputedStyle(bar).backgroundColor); ctx.fillRect(lx, 50, 12, 4); lx += 20; }
      ctx.fillStyle = cc(tok('--text-2'));
      ctx.fillText(lg.textContent.trim(), lx, 52);
      lx += ctx.measureText(lg.textContent.trim()).width + 24;
    }
    if (project.updated) { ctx.textAlign = 'right'; ctx.fillText(`更新 ${project.updated}`, W - M, 26); ctx.textAlign = 'left'; }
    ctx.fillStyle = cc(tok('--bd'));
    ctx.fillRect(0, HEAD - 1, W, 1);

    ctx.translate(-x0, HEAD - y0);
    const box = (r, radius) => { ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, radius); };
    const fillGradient = (el, r, radius) => {
      const g = parseGradient(getComputedStyle(el).backgroundImage);
      if (!g) return;
      const grad = g.horizontal ? ctx.createLinearGradient(r.x, r.y, r.x + r.w, r.y) : ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      g.stops.forEach((st) => grad.addColorStop(Math.max(0, Math.min(1, st.at)), st.color));
      ctx.fillStyle = grad;
      box(r, radius);
      ctx.fill();
    };
    // 文字は 1 文字ずつ画面上の位置に置く（折り返し・字間を画面と一致させる）
    const range = document.createRange();
    const drawText = (el) => {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      for (let t = walker.nextNode(); t; t = walker.nextNode()) {
        const cs = getComputedStyle(t.parentElement);
        ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        ctx.fillStyle = cc(cs.color);
        const str = t.data;
        for (let i = 0; i < str.length; i++) {
          const n = str.codePointAt(i) > 0xffff ? 2 : 1;
          const ch = str.slice(i, i + n);
          range.setStart(t, i);
          range.setEnd(t, i + n);
          i += n - 1;
          if (!ch.trim()) continue;
          const r = range.getBoundingClientRect();
          if (!r.width) continue;
          const p = loc(r);
          ctx.fillText(ch, p.x, p.y + p.h / 2);
        }
      }
    };

    // 線（画面と同じく段の帯より下に描く）
    for (const g of els.wires.children) {
      ctx.save();
      ctx.globalAlpha = Number(getComputedStyle(g).opacity);
      const path = g.querySelector('path'), ps = getComputedStyle(path);
      ctx.strokeStyle = cc(ps.stroke);
      ctx.lineWidth = parseFloat(ps.strokeWidth) || 1.25;
      ctx.setLineDash(ps.strokeDasharray === 'none' ? [] : ps.strokeDasharray.split(/[\s,]+/).map(parseFloat));
      ctx.lineCap = ps.strokeLinecap || 'butt';
      ctx.stroke(new Path2D(path.getAttribute('d')));
      const poly = g.querySelector('polygon'), pls = getComputedStyle(poly);
      ctx.setLineDash([]);
      ctx.fillStyle = cc(pls.fill);
      const pts = poly.getAttribute('points').trim().split(/\s+/).map((pt) => pt.split(',').map(Number));
      ctx.beginPath();
      pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
      ctx.closePath();
      ctx.fill();
      if (pls.stroke !== 'none') { ctx.strokeStyle = cc(pls.stroke); ctx.lineWidth = parseFloat(pls.strokeWidth) || 1; ctx.stroke(); }
      const port = g.querySelector('rect'), rs = getComputedStyle(port);
      const pr = ['x', 'y', 'width', 'height'].map((k) => Number(port.getAttribute(k)));
      ctx.fillStyle = cc(rs.fill);
      ctx.fillRect(...pr);
      ctx.strokeStyle = cc(rs.stroke);
      ctx.lineWidth = parseFloat(rs.strokeWidth) || 1;
      ctx.strokeRect(...pr);
      ctx.restore();
    }
    // グループの枠と見出し
    for (const grp of els.rows.querySelectorAll('.grp')) {
      const r = loc(grp.getBoundingClientRect()), cs = getComputedStyle(grp);
      fillGradient(grp, r, 0);
      ctx.strokeStyle = cc(cs.borderRightColor);
      ctx.lineWidth = 1;
      ctx.setLineDash(cs.borderRightStyle === 'dashed' ? [4, 3] : []);
      ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
      ctx.setLineDash([]);
      // 色の付いた太い辺（横の流れの列は上、縦の流れの帯は左）
      if (cs.borderLeftStyle !== 'dashed' && parseFloat(cs.borderLeftWidth) > 1) {
        ctx.fillStyle = cc(cs.borderLeftColor);
        ctx.fillRect(r.x, r.y, parseFloat(cs.borderLeftWidth), r.h);
      }
      if (cs.borderTopStyle !== 'dashed' && parseFloat(cs.borderTopWidth) > 1) {
        ctx.fillStyle = cc(cs.borderTopColor);
        ctx.fillRect(r.x, r.y, r.w, parseFloat(cs.borderTopWidth));
      }
      drawText(grp.querySelector('.grp-h'));
    }
    for (const t of els.rows.querySelectorAll('.tools')) {
      const r = loc(t.getBoundingClientRect()), ts = getComputedStyle(t), left = parseFloat(ts.borderLeftWidth) > 0;
      ctx.strokeStyle = cc(left ? ts.borderLeftColor : ts.borderTopColor);
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      if (left) { ctx.moveTo(r.x + 0.5, r.y); ctx.lineTo(r.x + 0.5, r.y + r.h); } else { ctx.moveTo(r.x, r.y + 0.5); ctx.lineTo(r.x + r.w, r.y + 0.5); }
      ctx.stroke();
      ctx.setLineDash([]);
      drawText(t.querySelector('.tools-h'));
    }
    // 箱
    for (const el of els.rows.querySelectorAll('.node')) {
      const r = loc(el.getBoundingClientRect()), cs = getComputedStyle(el);
      const radius = parseFloat(cs.borderTopLeftRadius) || 0;
      ctx.save();
      ctx.globalAlpha = Number(cs.opacity);
      ctx.fillStyle = cc(cs.backgroundColor);
      box(r, radius);
      ctx.fill();
      fillGradient(el, r, radius);
      ctx.strokeStyle = cc(cs.borderTopColor);
      ctx.lineWidth = el.classList.contains('sel') ? 2 : 1;
      ctx.setLineDash(cs.borderTopStyle === 'dashed' ? [4, 3] : []);
      ctx.beginPath();
      ctx.roundRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, radius);
      ctx.stroke();
      ctx.setLineDash([]);
      const before = getComputedStyle(el, '::before');
      if (before.content !== 'none') {
        ctx.save();
        ctx.globalAlpha *= Number(before.opacity);
        ctx.strokeStyle = cc(before.borderTopColor);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y + 11); ctx.lineTo(r.x, r.y); ctx.lineTo(r.x + 11, r.y);
        ctx.moveTo(r.x + r.w - 11, r.y + r.h); ctx.lineTo(r.x + r.w, r.y + r.h); ctx.lineTo(r.x + r.w, r.y + r.h - 11);
        ctx.stroke();
        ctx.restore();
      }
      for (const pill of el.querySelectorAll('.svc, .out')) {
        const pr = loc(pill.getBoundingClientRect()), ps = getComputedStyle(pill);
        ctx.fillStyle = cc(ps.backgroundColor);
        ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
        ctx.strokeStyle = cc(ps.borderTopColor);
        ctx.lineWidth = 1;
        ctx.strokeRect(pr.x + 0.5, pr.y + 0.5, pr.w - 1, pr.h - 1);
      }
      const meterEl = el.querySelector('.meter');
      if (meterEl) {
        const mr = loc(meterEl.getBoundingClientRect()), ms = getComputedStyle(meterEl);
        const pct = parseFloat(ms.getPropertyValue('--p')) / 100 || 0;
        const col = cc(ms.getPropertyValue('--c').trim());
        const seg = mr.w / 10;
        for (let k = 0; k < 10; k++) {
          const sx = mr.x + seg * k, sw = seg - 2;
          const filled = Math.max(0, Math.min(sw, mr.x + mr.w * pct - sx));
          ctx.globalAlpha = Number(cs.opacity) * 0.16;
          ctx.fillStyle = col;
          ctx.fillRect(sx + filled, mr.y, sw - filled, mr.h);
          ctx.globalAlpha = Number(cs.opacity);
          if (filled > 0) ctx.fillRect(sx, mr.y, filled, mr.h);
        }
      }
      drawText(el);
      ctx.restore();
    }
    // 表示中の線ラベル
    for (const t of els.labels.querySelectorAll('.wl.on')) {
      const r = loc(t.getBoundingClientRect()), cs = getComputedStyle(t);
      ctx.fillStyle = cc(cs.backgroundColor);
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = cc(cs.borderTopColor);
      ctx.lineWidth = 1;
      ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
      drawText(t);
    }
    return cv;
  }
  async function exportPNG() {
    await document.fonts?.ready;
    document.documentElement.classList.add('no-anim');
    let cv;
    try { cv = exportCanvas(); } finally { document.documentElement.classList.remove('no-anim'); }
    if (!cv) return;
    cv.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(project.name || 'arch-map').replace(/[\\/:*?"<>|\s]+/g, '_')}_${state.view}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, 'image/png');
  }

  /* ── events ── */
  els.tabs.addEventListener('click', (ev) => { const t = ev.target.closest('[data-view]'); if (t) setView(t.dataset.view); });
  els.stage.addEventListener('click', (ev) => {
    if (pan.suppress) return;
    const b = ev.target.closest('.node');
    select(b && state.sel !== b.dataset.id ? b.dataset.id : null);
  });
  els.panel.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-go]');
    if (t) go(t.dataset.go);
    const e = ev.target.closest('[data-edit]');
    if (e) startEdit(e.dataset.edit);
  });
  els.save.addEventListener('click', save);
  addEventListener('beforeunload', (ev) => { if (renames.size) { ev.preventDefault(); ev.returnValue = true; } });
  addEventListener('keydown', (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.target.closest?.('input')) return;
    if (ev.key === ' ' && pan.over && !ev.target.closest?.('button')) { ev.preventDefault(); pan.space = true; els.stage.classList.add('space'); return; }
    const v = VIEWS.find((x) => x.key === ev.key);
    if (v) setView(v.id);
    else if (ev.key === 'Escape') select(null);
    else if (ev.key === '+' || ev.key === '=') zoomBy(1.2);
    else if (ev.key === '-') zoomBy(1 / 1.2);
    else if (ev.key === '0') zoomBy(1 / cam.z);
    else if (ev.key === 'f') fitView(true);
    else if (ev.key === 'h') home();
    else if (ev.key === 'r') toggleDir();
    else if (ev.key === 't') toggleTheme();
    else if (ev.key === 'p') exportPNG();
    else if (ev.key === 'i') setInsp(els.app.classList.contains('insp-off'));
  });
  addEventListener('keyup', (ev) => { if (ev.key === ' ') { pan.space = false; els.stage.classList.remove('space'); } });
  addEventListener('hashchange', () => { readHash(); renderAll(); });
  let raf = 0;
  const redraw = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawWires(); applyZoom(); }); };
  new ResizeObserver(redraw).observe(els.rows);
  new ResizeObserver(() => applyZoom()).observe(els.stage);
  // 文字の幅が変わるので、線のラベルの幅を測り直して並べ直す
  document.fonts?.ready.then(() => { labelW.clear(); renderStage(); if (cam.touched) applyZoom(); else { fitView(false); if (state.sel) reveal(state.sel); } });
  if (!reduceMotion) {
    let f = 0;
    setInterval(() => { f = (f + 1) % SPIN.length; for (const s of document.querySelectorAll('.spin')) s.textContent = SPIN[f]; }, 90);
  }

  readHash();
  renderAll();
  fitView(false);
  if (state.sel) reveal(state.sel);
})();
</script>
</body>
</html>
